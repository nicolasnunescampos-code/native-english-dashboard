name: 🚀 Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual click to deploy from GitHub website anytime

jobs:
  web-deploy:
    name: 📦 Build and Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 🟢 Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 🔨 Install dependencies
        run: npm ci || npm install

      - name: 🏗️ Build Project
        run: npm run build

      - name: 🧹 Clean FTP Hostname
        id: ftp_prep
        run: |
          RAW="${{ secrets.FTP_SERVER }}"
          # Remove protocol (ftp://, https://), trailing path/slashes, and ports if accidentally pasted
          CLEAN=$(echo "$RAW" | sed -E 's|^[a-zA-Z]+://||; s|/.*||; s|:[0-9]+$||; s|[[:space:]]||g')
          echo "host=$CLEAN" >> $GITHUB_OUTPUT

      - name: 📂 Sync files to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ steps.ftp_prep.outputs.host }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: public_html/login/
          local-dir: ./dist/
          dangerous-clean-slate: false
